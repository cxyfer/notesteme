name: Bench

# NFR 中驗證方式為 `bench` 的項目（docs/specs/nfr.md 第 1 節；bench 本身在 internal/nfrbench，資料由 internal/benchdata 產生）。
# - schedule：每晚跑完整規模（item 與 lib10k 兩組）。
# - 已知未達標的 bench 命名為 BenchmarkKnownMiss*，放在另外一個 continue-on-error 的 job（nfr.md 第 11.3 節）；目前沒有。
# - workflow_dispatch：手動觸發，可只跑某一組、或縮小 lib-10k 的比例。
# - pull_request：只在相關目錄有變更時觸發，而且只跑縮小規模的 smoke（不拖慢 PR；完整規模請手動觸發）。
# 每個 bench 的門檻就是 nfr.md 的數字，超過時 go test 失敗、job 失敗；結果寫進 job summary 並上傳 artifact。
on:
  schedule:
    - cron: "43 18 * * *" # UTC 18:43（台灣時間 02:43；fuzz.yml 在 18:17）
  workflow_dispatch:
    inputs:
      group:
        description: 要跑的組
        type: choice
        options: [all, item, lib10k]
        default: all
      scale:
        description: lib-10k 的比例（1 是完整規模；0.05 約 1/20）
        default: "1"
  pull_request:
    paths:
      - ".github/workflows/bench.yml"
      - "scripts/ci/bench-summary.py"
      - "internal/benchdata/**"
      - "internal/nfrbench/**"
      - "internal/store/**"
      - "internal/search/**"
      - "internal/subtitle/**"
      - "internal/output/**"
      - "internal/vault/**"
      - "internal/pipeline/**"
      - "internal/api/**"
      - "internal/app/**"
      - "internal/backup/**"
      - "internal/cli/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 明確指定 bash：GitHub 只有在 shell: bash 時才帶 -o pipefail；否則 `go test | tee` 失敗時 step 仍是成功。
defaults:
  run:
    shell: bash

env:
  # bench 的共同參數：只跑 Benchmark（-run '^$'），每個 Benchmark 一輪（函式內自己取樣固定次數）。
  BENCH_FLAGS: -run '^$' -benchtime=1x -count=1 -timeout 90m

jobs:
  smoke:
    name: Bench smoke (PR, scaled down)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTESTEME_BENCH_REPORT: ${{ github.workspace }}/bench-report.jsonl
      NOTESTEME_BENCH_SCALE: "0.01"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build notesteme
        run: go build -trimpath -o "$RUNNER_TEMP/notesteme" ./cmd/notesteme && echo "NOTESTEME_BENCH_BIN=$RUNNER_TEMP/notesteme" >> "$GITHUB_ENV"
      # 已知未達標的 bench 命名為 BenchmarkKnownMiss*，不在這個 regexp 裡。
      - name: bench (lib-10k × 0.01, item-long)
        run: go test ./internal/nfrbench $BENCH_FLAGS -bench '^Benchmark(Perf|Res|Rel|Cmp)' 2>&1 | tee bench-smoke.txt
      - name: summary
        if: ${{ !cancelled() }}
        run: python3 -I scripts/ci/bench-summary.py "$NOTESTEME_BENCH_REPORT" "Bench smoke（lib-10k × 0.01，數字不代表完整規模）" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-smoke
          path: |
            bench-report.jsonl
            bench-smoke.txt
          if-no-files-found: ignore

  item:
    name: Bench item-long & process (PERF-2/4/5/6/7, RES-1/2/3)
    if: github.event_name != 'pull_request' && (inputs.group == '' || inputs.group == 'all' || inputs.group == 'item')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NOTESTEME_BENCH_REPORT: ${{ github.workspace }}/bench-report.jsonl
      NOTESTEME_BENCH_IDLE_SECONDS: "60"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build notesteme
        run: go build -trimpath -o "$RUNNER_TEMP/notesteme" ./cmd/notesteme && echo "NOTESTEME_BENCH_BIN=$RUNNER_TEMP/notesteme" >> "$GITHUB_ENV"
      - name: bench
        run: go test ./internal/nfrbench $BENCH_FLAGS -bench '^Benchmark(Perf(2|4|5|6|7)|Res)' 2>&1 | tee bench-item.txt
      - name: summary
        if: ${{ !cancelled() }}
        run: python3 -I scripts/ci/bench-summary.py "$NOTESTEME_BENCH_REPORT" "Bench：item-long 與程序資源" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-item
          path: |
            bench-report.jsonl
            bench-item.txt
          if-no-files-found: ignore

  lib10k:
    name: Bench lib-10k (PERF-1/3/8/9, REL-5, CMP-5)
    if: github.event_name != 'pull_request' && (inputs.group == '' || inputs.group == 'all' || inputs.group == 'lib10k')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NOTESTEME_BENCH_REPORT: ${{ github.workspace }}/bench-report.jsonl
      NOTESTEME_BENCH_LIB: ${{ github.workspace }}/../lib10k
      SCALE: ${{ inputs.scale || '1' }}
    steps:
      - uses: actions/checkout@v7
      # 完整的 lib-10k 約 5GB，加上備份、還原前快照與 CMP-5 的副本約需 15GB：先移除 runner 上用不到的工具。
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build notesteme
        run: go build -trimpath -o "$RUNNER_TEMP/notesteme" ./cmd/notesteme && echo "NOTESTEME_BENCH_BIN=$RUNNER_TEMP/notesteme" >> "$GITHUB_ENV"
      - name: generate lib-10k
        run: |
          go run ./internal/benchdata/cmd/genlib -out "$NOTESTEME_BENCH_LIB" -profile lib-10k -scale "$SCALE"
          if [ "$SCALE" != "1" ]; then echo "NOTESTEME_BENCH_LIB_NAME=lib-10k@$SCALE" >> "$GITHUB_ENV"; fi
          du -sh "$NOTESTEME_BENCH_LIB" "$NOTESTEME_BENCH_LIB/artifacts"
          df -h /
      # 每組一個 step：前一組失敗時其他組照跑（!cancelled()），job 的結果是全部的 AND。
      # 順序：只讀的查詢先跑；REL-5 會把 DB 還原成它自己的備份；CMP-5 最後（複製一份 DB）。
      - name: PERF-1 items list
        if: ${{ !cancelled() }}
        run: go test ./internal/nfrbench $BENCH_FLAGS -bench '^BenchmarkPerf1' 2>&1 | tee -a bench-lib.txt
      - name: PERF-3 title search
        if: ${{ !cancelled() }}
        run: go test ./internal/nfrbench $BENCH_FLAGS -bench '^BenchmarkPerf3' 2>&1 | tee -a bench-lib.txt
      - name: PERF-9 full-text search
        if: ${{ !cancelled() }}
        run: go test ./internal/nfrbench $BENCH_FLAGS -bench '^BenchmarkPerf9' 2>&1 | tee -a bench-lib.txt
      - name: PERF-8 CLI items ls
        if: ${{ !cancelled() }}
        run: go test ./internal/nfrbench $BENCH_FLAGS -bench '^BenchmarkPerf8' 2>&1 | tee -a bench-lib.txt
      - name: REL-5 backup & restore
        if: ${{ !cancelled() }}
        run: |
          go test ./internal/nfrbench $BENCH_FLAGS -bench '^BenchmarkRel5' 2>&1 | tee -a bench-lib.txt
          rm -rf "$NOTESTEME_BENCH_LIB/backups"
          df -h /
      - name: CMP-5 migrations on lib-10k
        if: ${{ !cancelled() }}
        run: go test ./internal/nfrbench $BENCH_FLAGS -bench '^BenchmarkCmp5' 2>&1 | tee -a bench-lib.txt
      - name: summary
        if: ${{ !cancelled() }}
        run: python3 -I scripts/ci/bench-summary.py "$NOTESTEME_BENCH_REPORT" "Bench：lib-10k（× $SCALE）" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-lib10k
          path: |
            bench-report.jsonl
            bench-lib.txt
          if-no-files-found: ignore

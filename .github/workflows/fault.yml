name: Fault injection

# NFR-REL-1～3：每個故障點（步驟的開始、中間、提交前，產出檔 rename 前後，付費呼叫回來與落地之後）
# 各 kill -9 100 次再重新啟動，斷言 DB 沒有損毀、pipeline 做完且結果相同、產出的 sha256 相符、沒有重複付費；
# 另外跑 REL-2 的損毀測試。設計見 docs/specs/nfr.md 第 11.1 節。CI 的 go job 只跑每點 1 次的縮小版。
on:
  schedule:
    - cron: "47 19 * * *" # UTC 19:47（台灣時間 03:47），與 fuzz.yml 錯開
  workflow_dispatch:
    inputs:
      iterations:
        description: 每個故障點的迭代次數
        default: "100"

permissions:
  contents: read

jobs:
  fault:
    name: Fault injection (kill -9)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: fault injection
        env:
          NOTESTEME_FAULT_ITERATIONS: ${{ inputs.iterations || '100' }}
          NOTESTEME_FAULT_PARALLEL: "4"
        run: go test -tags faultinject -count=1 -timeout 80m -v -run 'TestFaultInjection|TestCorruptArtifactIsDetectedAndRerun' ./features/fault

      # 失敗的迭代保留根目錄（/tmp/nstfault*，錯誤訊息附路徑與 (點, 第幾次命中)），上傳供本機重現。
      - name: upload failing iterations
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fault-failing-iterations
          path: /tmp/nstfault*
          if-no-files-found: ignore
          retention-days: 7

name: CI

# 測試與檢查；docker、compose、docker-arm64 job 會在 runner 上建置 image 並啟動，但不推送。image 只在 v* tag 時由 docker-publish.yml 建置並推送。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # 發布 image 的 workflow 會先呼叫這裡的檢查，tag 指向未驗證的 commit 時不會發布。
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR 有新 commit 時取消舊的執行；master 的執行不中斷。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLC_VERSION: "1.31.1"
  GOVULNCHECK_VERSION: "v1.10.0"
  GORELEASER_VERSION: "v2.20.3"

jobs:
  go:
    name: Go lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下檔案需要 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # features/fault 與 internal/faultpoint 的 on.go 只在 faultinject tag 下編譯（NFR-REL-1～3）。
      # 只有這兩個套件的檔案隨 tag 改變（internal/faultpoint 的 TestOnlyFaultpointUsesTheTag 擋住其他地方使用這個 tag），
      # 其餘套件的 vet 結果與上一步相同，不再重做。
      - name: go vet (faultinject)
        run: go vet -tags faultinject ./internal/faultpoint ./features/fault

      # 驗收場景（features 套件本身）另開 bdd 與 bdd-extra 兩個 job，各自佔一台 runner；
      # 這裡只跑其餘的套件（含 features/steps、features/internal 的 harness 單元測試）。
      # -race 下 internal/pipeline 與 internal/api 各要 10～26 分鐘，所以逾時放寬到 60m（每個測試 binary 各自計算）。
      - name: go test (race, without the scenarios)
        run: go test -race -count=1 -timeout 60m $(go list ./... | grep -vx 'github.com/cxyfer/notesteme/features')

      # NFR-REL-1～3 的故障注入縮小版：51 個故障點各 kill -9 一次再重新啟動，與 REL-2 的損毀測試平行；
      # 每點 100 次的完整版在 fault.yml 每晚執行（docs/specs/nfr.md 第 11.1 節）。internal/faultpoint 只跑
      # 需要 tag 的 TestHit*：正式建置不含故障注入的檢查（會再建一次 binary）已在上一步以一般建置跑過。
      - name: fault injection (1 iteration per point)
        env:
          NOTESTEME_FAULT_ITERATIONS: "1"
          NOTESTEME_FAULT_PARALLEL: "4"
        run: go test -tags faultinject -count=1 -timeout 15m -run '^(TestFaultInjection|TestCorruptArtifactIsDetectedAndRerun|TestHit.*)$' ./features/fault ./internal/faultpoint

  # NFR-TEST-3：核心 package 涵蓋率 >= 80%。coverage.sh 會重跑這幾個 package，獨立成一個 job 才不會拖長 go job。
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: coverage gate
        run: scripts/ci/coverage.sh

  # 驗收場景（godog）與規格靜態檢查（features 套件）：預設 tag @M1,@M2（313 個），套用 features/passing.txt 的 ratchet。
  # 在 -race 下本機約 22 分鐘、GitHub runner 更慢，所以獨佔一台 runner，逾時 60m。
  bdd:
    name: Scenarios (@M1,@M2, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go test ./features (race)
        run: go test -race -count=1 -timeout 60m ./features

  # @M3、@M4、@M5 的場景（共 630 個）全部通過；不放進 -race 的預設執行，以免逾時。
  # 預設 tag 之外的執行不套用 ratchet，這一步擋的是「任何場景 failed 或 undefined」。
  bdd-extra:
    name: Scenarios (@M3–M5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # NFR-TEST-2：完整的 features 在 CI 上 < 5 分鐘。以不開 -race 的執行為準（-race 讓場景慢 6～8 倍，
      # 是上面 bdd job 的另一層安全檢查）；預設 tag 與 @M3,@M4,@M5 兩個 job 平行，各自要在 5 分鐘內，
      # 完整 features 的牆鐘時間就是兩者的最大值。超過時失敗，門檻不放寬。
      - name: go test ./features (@M3,@M4,@M5, under 5 minutes)
        run: |
          start=$SECONDS
          go test -count=1 -timeout 45m ./features -run TestFeatures -godog.tags='@M3,@M4,@M5'
          elapsed=$((SECONDS - start))
          echo "features @M3,@M4,@M5（含編譯）：${elapsed} 秒"
          test "$elapsed" -lt 300 || { echo "::error::NFR-TEST-2：@M3,@M4,@M5 的場景用了 ${elapsed} 秒，超過 300 秒"; exit 1; }

  # 預設 tag（@M1,@M2）不開 -race 的執行（NFR-TEST-2，見 bdd-extra 的說明）；套用 ratchet 與規格一致性檢查。
  bdd-fast:
    name: Scenarios (@M1,@M2, no race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go test ./features (under 5 minutes)
        run: |
          start=$SECONDS
          go test -count=1 -timeout 45m ./features
          elapsed=$((SECONDS - start))
          echo "features 預設 tag（含編譯與規格一致性檢查）：${elapsed} 秒"
          test "$elapsed" -lt 300 || { echo "::error::NFR-TEST-2：預設 tag 的場景用了 ${elapsed} 秒，超過 300 秒"; exit 1; }

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 用 go.mod 的 toolchain（發布用的版本，go1.26.11）執行：標準函式庫的弱點以實際建置的版本為準。
      # govulncheck v1.10.0 要求 Go >= 1.26，toolchain 已滿足。
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # NFR-SEC-4：只有程式實際呼叫到的弱點才會讓指令失敗（exit 3）。
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  release-check:
    name: goreleaser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # .goreleaser.yaml 的 before.hooks 會建置 Web UI（npm ci && npm run build）。
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/client/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/client/package-lock.json
            web/hub/package-lock.json

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: build --snapshot --clean

      # NFR-CMP-1：對 linux/amd64 產物做冒煙測試。
      - name: smoke test
        run: |
          bin="$(ls dist/notesteme_linux_amd64*/notesteme)"
          out="$("$bin" --version)"
          echo "$out"
          test -n "$out"
          # 發布的 binary 要內嵌真正的 Web UI，不是 placeholder（Vite 產生的 index.html 引用 /assets/index-*.js）。
          if ! grep -aq 'src="/assets/index-' "$bin"; then
            echo "::error::binary 沒有內嵌 Web UI 的建置產物（只有 placeholder）"
            exit 1
          fi
          # Hub 是另一個 binary（ADR-0030），內嵌自己的 UI（web/hub），同樣不能是 placeholder。
          hub="$(ls dist/notesteme-hub_linux_amd64*/notesteme-hub)"
          "$hub" --version
          if ! grep -aq 'src="/assets/index-' "$hub"; then
            echo "::error::notesteme-hub 沒有內嵌 Hub UI 的建置產物（只有 placeholder）"
            exit 1
          fi

      # NFR-RES-5：原生 binary < 80MB（以 10^6 計，比 2^20 更嚴）。每個平台都量；超過時失敗，門檻不放寬。
      - name: binary sizes
        run: |
          limit=$((80 * 1000 * 1000))
          fail=0
          for f in dist/notesteme_*/notesteme dist/notesteme_*/notesteme.exe dist/notesteme-hub_*/notesteme-hub; do
            [ -f "$f" ] || continue
            size="$(stat -c %s "$f")"
            echo "$f: $size bytes"
            if [ "$size" -ge "$limit" ]; then
              echo "::error::NFR-RES-5：$f 是 $size bytes，超過 80MB"
              fail=1
            fi
          done
          exit "$fail"

  # Hub 的 Postgres store 與 S3 backend（ADR-0030 第 2 點）：hubstore/storetest 的共用案例跑在真的 Postgres 上，
  # hubblob 的共用案例跑在真的 S3 相容服務（SeaweedFS）上。沒有這些環境變數時同一組測試會略過（go job 只跑 SQLite＋fs）。
  hub-backends:
    name: Hub postgres & s3
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub-ci-password
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NOTESTEME_TEST_POSTGRES_DSN: postgres://hub:hub-ci-password@127.0.0.1:5432/hub?sslmode=disable
      NOTESTEME_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      NOTESTEME_TEST_S3_BUCKET: notesteme-test
      NOTESTEME_TEST_S3_ACCESS_KEY_ID: s3-ci
      NOTESTEME_TEST_S3_SECRET_ACCESS_KEY: s3-ci-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # S3 相容服務用 SeaweedFS（Apache-2.0）的 release binary，版本與 sha256 固定。
      # MinIO 社群版已停止發布 image（quay.io 要認證、Docker Hub 沒有該 tag，GitHub repo 也已封存），拉不到了。
      # 設了 identity，所以 SigV4 簽章不對的請求會被拒絕（hubblob 的「錯誤 secret」案例才驗得到）；bucket 由 aws CLI 建立。
      - name: start seaweedfs (s3)
        env:
          SEAWEEDFS_VERSION: "4.55"
          SEAWEEDFS_SHA256: f156c609eeaf9e5fcfeea33fd70411222005f83760aa95893c9d58eff006b45c
        run: |
          curl -fsSL -o "$RUNNER_TEMP/weed.tar.gz" "https://github.com/seaweedfs/seaweedfs/releases/download/${SEAWEEDFS_VERSION}/linux_amd64.tar.gz"
          echo "${SEAWEEDFS_SHA256}  $RUNNER_TEMP/weed.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/weed" "$RUNNER_TEMP/weed-data"
          tar -xzf "$RUNNER_TEMP/weed.tar.gz" -C "$RUNNER_TEMP/weed" weed
          cat > "$RUNNER_TEMP/weed/s3.json" <<EOF
          {"identities":[{"name":"ci","credentials":[{"accessKey":"${NOTESTEME_TEST_S3_ACCESS_KEY_ID}","secretKey":"${NOTESTEME_TEST_S3_SECRET_ACCESS_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          EOF
          nohup "$RUNNER_TEMP/weed/weed" server -dir="$RUNNER_TEMP/weed-data" -ip=127.0.0.1 \
            -master.volumeSizeLimitMB=128 -volume.max=20 \
            -s3 -s3.port=9000 -s3.config="$RUNNER_TEMP/weed/s3.json" > "$RUNNER_TEMP/weed.log" 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)"
            # 有 identity 時匿名請求回 403；只要不是連線失敗（000）就代表 S3 gateway 起來了
            if [ "$code" != "000" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo "::error::SeaweedFS 60 秒內沒有就緒"; tail -n 50 "$RUNNER_TEMP/weed.log"; exit 1; fi
          export AWS_ACCESS_KEY_ID="$NOTESTEME_TEST_S3_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$NOTESTEME_TEST_S3_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=us-east-1
          made=0
          for i in $(seq 1 30); do
            if aws --endpoint-url "$NOTESTEME_TEST_S3_ENDPOINT" s3 mb "s3://$NOTESTEME_TEST_S3_BUCKET"; then made=1; break; fi
            sleep 2
          done
          if [ "$made" != 1 ]; then echo "::error::建立 bucket 失敗"; tail -n 50 "$RUNNER_TEMP/weed.log"; exit 1; fi
          # 反證：沒簽章的請求必須被拒絕（403）。bucket 已存在，所以沒驗證簽章時會是 404（NoSuchKey）。
          code="$(curl -s -o /dev/null -w '%{http_code}' "$NOTESTEME_TEST_S3_ENDPOINT/$NOTESTEME_TEST_S3_BUCKET/anon-probe")"
          if [ "$code" != 403 ]; then echo "::error::匿名請求預期 403，實際 $code：SeaweedFS 沒有驗證簽章"; exit 1; fi
          echo "匿名請求被拒絕（403）"

      - name: seaweedfs log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/weed.log" || true

      - name: go test (hub backends)
        run: go test -race -count=1 -timeout 15m ./internal/hub/hubstore/... ./internal/hub/hubblob/ ./internal/hub/hubcli/ ./internal/hub/

  # 實際建置 image 並啟動（本機沒有 Docker 時驗證不到的部分）：
  # Client image 跑 deploy/docker/smoke-test.sh；Hub 用 compose.hub.yaml 啟動整組服務
  # （Postgres、SeaweedFS、migrate、hub），確認 hub 就緒並通過 doctor（連得上 Postgres 與 S3 bucket）。
  docker:
    name: Docker images & hub stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build client image
        run: docker build -f deploy/docker/Dockerfile -t notesteme:ci .

      - name: smoke test (client image)
        run: deploy/docker/smoke-test.sh notesteme:ci

      - name: hub stack up
        working-directory: deploy/docker
        run: |
          # umask 只作用在 .env.hub；設定檔要維持預設權限，容器內的非 root 使用者才讀得到。
          (
            umask 077
            {
              echo "NOTESTEME_HUB_MASTER_KEY=$(openssl rand -base64 32)"
              echo "NOTESTEME_HUB_SESSION_KEY=$(openssl rand -base64 32)"
              echo "NOTESTEME_HUB_POSTGRES_PASSWORD=$(openssl rand -hex 24)"
              echo "NOTESTEME_HUB_S3_ACCESS_KEY_ID=notestemehub"
              echo "NOTESTEME_HUB_S3_SECRET_ACCESS_KEY=$(openssl rand -hex 24)"
              echo "NOTESTEME_HUB_OAUTH_GITHUB_CLIENT_SECRET=ci-client-secret"
            } > .env.hub
          )
          mkdir -p hub-config
          cp hub-config.example.yaml hub-config/notesteme-hub.yaml
          # doctor 要求至少啟用一個登入方式：填入假的 client_id（只啟用設定，不會連到 GitHub）。
          sed -i 's/github: { client_id: "" }/github: { client_id: "ci-client-id" }/' hub-config/notesteme-hub.yaml
          grep -q 'client_id: "ci-client-id"' hub-config/notesteme-hub.yaml
          docker compose -f compose.hub.yaml --env-file .env.hub --profile hub up -d --build
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:8090/readyz
          docker compose -f compose.hub.yaml --env-file .env.hub --profile hub run --rm hub doctor
          # 反證：hub-s3 要驗證簽章。bucket 已存在，匿名 GET 不存在的物件：有驗證是 403，沒驗證會是 404。
          bucket="$(sed -n 's/^NOTESTEME_HUB_S3_BUCKET=//p' .env.hub | head -n 1)"
          anon="$(docker compose -f compose.hub.yaml --env-file .env.hub --profile hub exec -T hub-s3 \
            wget -S -O /dev/null "http://127.0.0.1:9000/${bucket:-notesteme-hub}/anon-probe" 2>&1 || true)"
          echo "$anon"
          grep -q 'HTTP/1.1 403' <<<"$anon" || { echo "::error::hub-s3 的匿名請求預期 403"; exit 1; }

      # 重啟後資料還在：Postgres 與 S3 各寫一筆標記，down（不帶 -v）再 up，兩邊都要讀得回來，hub 重新就緒並通過 doctor。
      - name: hub stack restart keeps data
        working-directory: deploy/docker
        run: |
          hub() { docker compose -f compose.hub.yaml --env-file .env.hub --profile hub "$@"; }
          hub exec -T hub-postgres psql -U notesteme_hub -d notesteme_hub -v ON_ERROR_STOP=1 \
            -c "create table ci_restart_marker (v text); insert into ci_restart_marker values ('kept');"
          # hub-s3-init 的 image 有 curl 與 sha256sum，且帶著 S3 的金鑰與 bucket 名稱：覆寫它的指令來寫入與讀回物件。
          s3put='h="$(printf kept | sha256sum | cut -d" " -f1)"; code="$(printf kept | curl -s -o /dev/null -w "%{http_code}" -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -H "x-amz-content-sha256: $h" --data-binary @- "http://hub-s3:9000/$BUCKET/ci-restart-marker")"; echo "PUT -> $code"; test "$code" = 200'
          s3get='empty=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855; code="$(curl -s -o /tmp/obj -w "%{http_code}" --aws-sigv4 "aws:amz:us-east-1:s3" --user "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" -H "x-amz-content-sha256: $empty" "http://hub-s3:9000/$BUCKET/ci-restart-marker")"; echo "GET -> $code body=$(cat /tmp/obj)"; test "$code" = 200 && test "$(cat /tmp/obj)" = kept'
          hub run -T --rm hub-s3-init "$s3put"
          hub run -T --rm hub-s3-init "$s3get"
          hub down
          hub up -d
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:8090/readyz
          hub run --rm hub doctor
          kept="$(hub exec -T hub-postgres psql -U notesteme_hub -d notesteme_hub -tA -c 'select v from ci_restart_marker')"
          echo "postgres marker: $kept"
          test "$kept" = kept
          hub run -T --rm hub-s3-init "$s3get"

      - name: hub stack logs
        if: failure()
        working-directory: deploy/docker
        run: docker compose -f compose.hub.yaml --env-file .env.hub --profile hub logs --no-color --tail 150

      - name: hub stack down
        if: always()
        working-directory: deploy/docker
        run: docker compose -f compose.hub.yaml --env-file .env.hub --profile hub down -v

  # Client 的 compose.yaml 實際啟動：local profile（登入、資料在重建容器後還在、只映射到 loopback，OPS-R9）
  # 與 vps profile（vps-check 擋住沒有網域的設定、Caddy 反向代理、HTTPS、HSTS、固定位址，OPS-R19～R21）。
  # Caddy 的網域用 notes.local：通過 vps-check 的網域檢查，又屬於 Caddy 只用內部 CA 簽發的名稱，不需要公網與 ACME。
  compose:
    name: Client compose (local & vps)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: build client image
        run: docker build -f deploy/docker/Dockerfile -t notesteme:ci .

      - name: local profile
        working-directory: deploy/docker
        run: |
          pw=compose-ci-password
          printf 'NOTESTEME_IMAGE=notesteme:ci\nNOTESTEME_MASTER_KEY=%s\nNOTESTEME_PASSWORD=%s\nNOTESTEME_PORT=18080\n' "$(openssl rand -base64 32)" "$pw" > .env
          base=http://127.0.0.1:18080
          login() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"password\":\"$1\"}" "$base/api/auth/login"; }
          docker compose up -d --no-build --pull never
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS "$base/readyz"
          test "$(login "$pw")" = 200
          test "$(login wrong-password)" = 401
          # 只映射到 loopback（OPS-R9）。
          port="$(docker compose port notesteme 8080)"
          echo "port: $port"
          test "$port" = "127.0.0.1:18080"
          # 密碼只在第一次啟動時需要：從 .env 移除後重建容器，登入仍然成功，代表資料在 volume 裡。
          docker compose down
          sed -i '/^NOTESTEME_PASSWORD=/d' .env
          docker compose up -d --no-build --pull never
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS "$base/readyz"
          test "$(login "$pw")" = 200

      - name: local profile logs
        if: failure()
        working-directory: deploy/docker
        run: docker compose logs --no-color --tail 100

      - name: local profile down
        if: always()
        working-directory: deploy/docker
        run: docker compose down -v

      - name: vps profile
        working-directory: deploy/docker
        run: |
          pw=compose-ci-password
          key="$(openssl rand -base64 32)"
          dom=notes.local
          printf 'COMPOSE_PROFILES=vps\nNOTESTEME_IMAGE=notesteme:ci\nNOTESTEME_MASTER_KEY=%s\nNOTESTEME_PASSWORD=%s\nNOTESTEME_DEPLOYMENT=vps\n' "$key" "$pw" > .env
          # 反證：沒有網域時 vps-check 要失敗（Caddy 等它成功才會啟動）。
          if out="$(docker compose run -T --rm vps-check 2>&1)"; then
            echo "$out"; echo "::error::沒有 NOTESTEME_DOMAIN 時 vps-check 預期失敗"; exit 1
          fi
          echo "$out"
          grep -q NOTESTEME_DOMAIN <<<"$out" || { echo "::error::vps-check 的錯誤訊息沒有提到 NOTESTEME_DOMAIN"; exit 1; }
          printf 'NOTESTEME_DOMAIN=%s\n' "$dom" >> .env
          # notesteme 用本機剛建好的 image；caddy 需要從 registry 拉。
          docker compose up -d --no-build
          https() { curl -sk --resolve "$dom:443:127.0.0.1" "$@"; }
          https --retry 30 --retry-delay 2 --retry-all-errors -fS -o /dev/null "https://$dom/readyz"
          # HTTP 轉到 HTTPS。
          redirect="$(curl -s -o /dev/null -w '%{http_code}' --resolve "$dom:80:127.0.0.1" "http://$dom/")"
          echo "http -> $redirect"
          test "$redirect" = 308
          # HSTS（Caddyfile）。
          https -I "https://$dom/readyz" | tee /dev/stderr | grep -qi '^strict-transport-security: max-age=31536000'
          # 經由 Caddy 登入；vps 的 session cookie 一律帶 Secure（OPS-R21）。
          hdr="$(https -D - -o /dev/null -X POST -H 'Content-Type: application/json' -d "{\"password\":\"$pw\"}" "https://$dom/api/auth/login")"
          echo "$hdr"
          grep -q '^HTTP/[0-9.]* 200' <<<"$hdr"
          grep -i '^set-cookie:' <<<"$hdr" | grep -qi 'secure'
          # Caddy 的固定位址要和預設的 NOTESTEME_TRUSTED_PROXIES（172.31.250.10）一致（AUTH-R6）。
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q caddy)")"
          echo "caddy ip: $ip"
          test "$ip" = 172.31.250.10

      - name: vps profile logs
        if: failure()
        working-directory: deploy/docker
        run: docker compose --profile vps logs --no-color --tail 100

      - name: vps profile down
        if: always()
        working-directory: deploy/docker
        run: docker compose --profile vps down -v

  # NFR-CMP-1：Docker image 支援 arm64。binary 的 arm64 交叉編譯由 release-check 的 goreleaser 涵蓋；
  # 這裡真的建出 linux/arm64 的 image（Dockerfile 的 runtime 階段會在 arm64 上執行 apt、pip），
  # 並在 QEMU 下執行它帶的外部工具，確認 image 裡的每個 binary 都是 arm64 且跑得起來。不推送。
  docker-arm64:
    name: Docker image (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: build client image (linux/arm64)
        run: docker buildx build --platform linux/arm64 -f deploy/docker/Dockerfile -t notesteme:arm64 --load .

      - name: build hub image (linux/arm64)
        run: docker buildx build --platform linux/arm64 -f deploy/docker/Dockerfile --target notesteme-hub -t notesteme-hub:arm64 --load .

      - name: run the arm64 images
        run: |
          arch="$(docker run --rm --platform linux/arm64 --entrypoint uname notesteme:arm64 -m)"
          echo "client arch: $arch"
          test "$arch" = aarch64
          docker run --rm --platform linux/arm64 notesteme:arm64 --version
          docker run --rm --platform linux/arm64 --entrypoint sh notesteme:arm64 -c 'set -e; yt-dlp --version; ffmpeg -hide_banner -version | head -n 1; ffprobe -hide_banner -version | head -n 1; deno --version | head -n 1'
          docker run --rm --platform linux/arm64 notesteme-hub:arm64 --version

  # NFR-CMP-3：API 在 M1 之後不可移除欄位或改變欄位意義。比對這次推送（或 PR）之前的 OpenAPI 快照，
  # 有破壞性變更時失敗；真的要破壞時依 NFR 的規定先寫 ADR，再把 oasdiff 輸出的那一行加進 .github/oasdiff-err-ignore.txt。
  openapi-diff:
    name: OpenAPI breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: oasdiff breaking
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="HEAD~1" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "沒有可以比對的前一個版本（$base），略過"
            exit 0
          fi
          ignore=()
          [ -f .github/oasdiff-err-ignore.txt ] && ignore=(--err-ignore .github/oasdiff-err-ignore.txt)
          status=0
          for f in internal/api/openapi.json internal/hub/hubapi/openapi.json; do
            if ! git cat-file -e "$base:$f" 2>/dev/null; then
              echo "$f：前一個版本沒有這個檔案，略過"
              continue
            fi
            git show "$base:$f" > "$RUNNER_TEMP/base.json"
            echo "== $f（$base → HEAD）"
            go run github.com/oasdiff/oasdiff@v1.37.0 breaking "$RUNNER_TEMP/base.json" "$f" --fail-on ERR "${ignore[@]}" || status=1
          done
          exit "$status"

  sqlc:
    name: sqlc generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      # 確認 internal/store/sqlcdb 與 queries、migrations 一致。
      - name: sqlc diff
        working-directory: internal/store
        run: sqlc diff

      # Hub 的 SQLite 與 Postgres backend 各有自己的 sqlc.yaml（ADR-0030 第 2 點）。
      - name: sqlc diff (hub)
        working-directory: internal/hub/hubstore/sqlite
        run: sqlc diff

      - name: sqlc vet (hub)
        working-directory: internal/hub/hubstore/sqlite
        run: sqlc vet

      - name: sqlc diff (hub postgres)
        working-directory: internal/hub/hubstore/postgres
        run: sqlc diff

      - name: sqlc vet (hub postgres)
        working-directory: internal/hub/hubstore/postgres
        run: sqlc vet

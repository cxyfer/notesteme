name: CI

# 只跑測試與檢查，不建置 image；image 只在 v* tag 時由 docker-publish.yml 建置，
# 避免私人 repo 的 Actions 額度浪費在每次 PR 與合併上。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # 發布 image 的 workflow 會先呼叫這裡的檢查，tag 指向未驗證的 commit 時不會發布。
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR 有新 commit 時取消舊的執行；master 的執行不中斷。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLC_VERSION: "1.31.1"

jobs:
  go:
    name: Go lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下檔案需要 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # 包含 features/ 的驗收場景（godog）與規格靜態檢查。
      - name: go test
        run: go test -race -count=1 ./...

  sqlc:
    name: sqlc generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      # 確認 internal/store/sqlcdb 與 queries、migrations 一致。
      - name: sqlc diff
        working-directory: internal/store
        run: sqlc diff

name: CI

# 只跑測試與檢查，不建置 image；image 只在 v* tag 時由 docker-publish.yml 建置，
# 避免私人 repo 的 Actions 額度浪費在每次 PR 與合併上。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # 發布 image 的 workflow 會先呼叫這裡的檢查，tag 指向未驗證的 commit 時不會發布。
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR 有新 commit 時取消舊的執行；master 的執行不中斷。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLC_VERSION: "1.31.1"
  GOVULNCHECK_VERSION: "v1.10.0"
  GORELEASER_VERSION: "v2.20.3"

jobs:
  go:
    name: Go lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下檔案需要 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # NFR-TEST-3：核心 package 涵蓋率 >= 80%。
      - name: coverage gate
        run: scripts/ci/coverage.sh

      # 包含 features/ 的驗收場景（godog）與規格靜態檢查。
      - name: go test
        # features 的驗收場景（@M1 與 @M2 共 308 個）在 -race 下約 10 分鐘，超過 go test 預設的 10m 逾時。
        run: go test -race -count=1 -timeout 30m ./...
      # @M3、@M4、@M5 的場景（共 628 個）全部通過；不放進 -race 的預設執行，以免逾時。
      # 預設 tag 之外的執行不套用 ratchet，這一步擋的是「任何場景 failed 或 undefined」。
      - name: go test (M3–M5 scenarios)
        run: go test -count=1 -timeout 20m ./features -run TestFeatures -godog.tags='@M3,@M4,@M5'

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 用 go.mod 的 toolchain（發布用的版本，go1.26.11）執行：標準函式庫的弱點以實際建置的版本為準。
      # govulncheck v1.10.0 要求 Go >= 1.26，toolchain 已滿足。
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # NFR-SEC-4：只有程式實際呼叫到的弱點才會讓指令失敗（exit 3）。
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  release-check:
    name: goreleaser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # .goreleaser.yaml 的 before.hooks 會建置 Web UI（npm ci && npm run build）。
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/client/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/client/package-lock.json
            web/hub/package-lock.json

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: build --snapshot --clean

      # NFR-CMP-1：對 linux/amd64 產物做冒煙測試。
      - name: smoke test
        run: |
          bin="$(ls dist/notesteme_linux_amd64*/notesteme)"
          out="$("$bin" --version)"
          echo "$out"
          test -n "$out"
          # 發布的 binary 要內嵌真正的 Web UI，不是 placeholder（Vite 產生的 index.html 引用 /assets/index-*.js）。
          if ! grep -aq 'src="/assets/index-' "$bin"; then
            echo "::error::binary 沒有內嵌 Web UI 的建置產物（只有 placeholder）"
            exit 1
          fi
          # Hub 是另一個 binary（ADR-0030），內嵌自己的 UI（web/hub），同樣不能是 placeholder。
          hub="$(ls dist/notesteme-hub_linux_amd64*/notesteme-hub)"
          "$hub" --version
          if ! grep -aq 'src="/assets/index-' "$hub"; then
            echo "::error::notesteme-hub 沒有內嵌 Hub UI 的建置產物（只有 placeholder）"
            exit 1
          fi

  # Hub 的 Postgres store 與 S3 backend（ADR-0030 第 2 點）：hubstore/storetest 的共用案例跑在真的 Postgres 上，
  # hubblob 的共用案例跑在真的 MinIO 上。沒有這些環境變數時同一組測試會略過（go job 只跑 SQLite＋fs）。
  hub-backends:
    name: Hub postgres & s3
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub-ci-password
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NOTESTEME_TEST_POSTGRES_DSN: postgres://hub:hub-ci-password@127.0.0.1:5432/hub?sslmode=disable
      NOTESTEME_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      NOTESTEME_TEST_S3_BUCKET: notesteme-test
      NOTESTEME_TEST_S3_ACCESS_KEY_ID: minio-ci
      NOTESTEME_TEST_S3_SECRET_ACCESS_KEY: minio-ci-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # service container 不能指定 command（MinIO 要 server /data），所以用 docker run 啟動；bucket 由 mc 建立。
      - name: start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$NOTESTEME_TEST_S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$NOTESTEME_TEST_S3_SECRET_ACCESS_KEY" \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          docker exec minio sh -c 'mc alias set ci http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing ci/notesteme-test'

      - name: go test (hub backends)
        run: go test -race -count=1 -timeout 15m ./internal/hub/hubstore/... ./internal/hub/hubblob/ ./internal/hub/hubcli/ ./internal/hub/

  sqlc:
    name: sqlc generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      # 確認 internal/store/sqlcdb 與 queries、migrations 一致。
      - name: sqlc diff
        working-directory: internal/store
        run: sqlc diff

      # Hub 的 SQLite 與 Postgres backend 各有自己的 sqlc.yaml（ADR-0030 第 2 點）。
      - name: sqlc diff (hub)
        working-directory: internal/hub/hubstore/sqlite
        run: sqlc diff

      - name: sqlc vet (hub)
        working-directory: internal/hub/hubstore/sqlite
        run: sqlc vet

      - name: sqlc diff (hub postgres)
        working-directory: internal/hub/hubstore/postgres
        run: sqlc diff

      - name: sqlc vet (hub postgres)
        working-directory: internal/hub/hubstore/postgres
        run: sqlc vet

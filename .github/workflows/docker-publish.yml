name: Docker image

# 只有推送 release tag（含 -rc.N）時才建置；PR 與合併到 master 都不建置，
# 以節省 Actions 額度與 GHCR 儲存空間。每個 tag 只建置一次並以 digest 推送，
# 冒煙測試跑的就是推上去的 digest，通過後才把 release tag 指向它，
# 因此發布的 tag 不會對應到與驗證過的不同的建置。
on:
  push:
    tags: ["v*"]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push by digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # 版本由 tag 決定並寫進 binary；格式不符就中止，避免發布出版本號錯亂的 image。
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME 不是 vX.Y.Z 或 vX.Y.Z-rc.N 格式"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 這裡只推不可變的 commit tag；release tag 等冒煙測試通過後再依 digest 套用。
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  smoke:
    name: Smoke test digest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 以 digest 拉取：與下一步要重新標記的是同一個 image，不是本機重建的。
      - name: Smoke test
        run: deploy/docker/smoke-test.sh "${IMAGE}@${{ needs.build.outputs.digest }}"

  publish:
    name: Promote tested digest
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # `latest` 與移動的 X.Y tag 只跟著正式版；-rc.N 只得到完整版本號 tag。
      # 每個建置仍保留不可變的 sha-<短 sha> 以便回滾。
      - name: Release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Retag the tested digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no release tag resolved for this ref" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Tested digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

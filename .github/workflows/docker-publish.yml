name: Docker image

# 只有推送 release tag（含 -rc.N）時才建置；PR 與合併到 master 都不建置，
# 以節省 Actions 額度與 GHCR 儲存空間。tag 先通過與 CI 相同的 Go／sqlc 檢查，
# 再建置一次並以 digest 推送；冒煙測試跑的就是推上去的 digest，通過後才把
# release tag 指向它，因此發布的 tag 不會對應到與驗證過的不同的建置。
on:
  push:
    tags: ["v*"]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # tag 可能指向沒通過 CI 的 commit（或不在 master 上），發布前再驗證一次。
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push by digest
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # 版本由 tag 決定並寫進 binary；格式不符就中止，避免發布出版本號錯亂的 image。
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME 不是 vX.Y.Z 或 vX.Y.Z-rc.N 格式"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 這裡只推每個 tag 專屬的暫存 tag；release tag 等冒煙測試通過後再依 digest 套用。
      # 不用 sha tag：同一個 commit 先打 -rc.N 再打正式版時，兩者的 VERSION 不同，
      # 共用 sha tag 會讓後建置的覆寫前一個。
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=staging-${{ github.ref_name }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  smoke:
    name: Smoke test digest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 以 digest 拉取：與下一步要重新標記的是同一個 image，不是本機重建的。
      - name: Smoke test
        run: deploy/docker/smoke-test.sh "${IMAGE}@${{ needs.build.outputs.digest }}"

  publish:
    name: Promote tested digest
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `latest` 與移動的 X.Y tag 只跟著正式版，且只在這個 tag 是當時最高版本時移動。
      # 兩個 tag 相近推送、promote 順序顛倒時，舊版不會蓋掉新版；tag 在 run 開始前
      # 就已存在，所以判斷不受 run 完成順序影響。-rc.N 只得到完整版本號 tag。
      - name: Decide moving tags
        id: moving
        run: |
          set -euo pipefail
          latest=false
          minor=false
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *)
              # 只認嚴格的 vX.Y.Z；誤推的 v999 之類 tag 不能影響版本比較。
              stable="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
              top="$(printf '%s\n' "$stable" | sort -V | tail -n 1)"
              series="${GITHUB_REF_NAME%.*}"
              top_series="$(printf '%s\n' "$stable" | grep -E "^${series//./\\.}\\." | sort -V | tail -n 1)"
              [ "$top" = "$GITHUB_REF_NAME" ] && latest=true
              [ "$top_series" = "$GITHUB_REF_NAME" ] && minor=true
              ;;
          esac
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: latest=$latest minor=$minor"

      - name: Release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # metadata-action 預設會替 semver 規則自動加 latest，關掉後 latest 只由下面的 raw 規則決定。
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.moving.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.moving.outputs.latest == 'true' }}

      - name: Retag the tested digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no release tag resolved for this ref" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Tested digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

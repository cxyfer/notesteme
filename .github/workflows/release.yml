name: Release

# 只有推送 release tag（vX.Y.Z，含 -rc.N）時才建置；PR 與合併到 master 都不建置。完整流程見 RELEASING.md。
#   1. 驗證 tag 格式，再跑與 CI 相同的檢查。
#   2. Client 與 Hub 的 image 各建置一次並以 digest 推送；冒煙測試跑的就是推上去的 digest。
#   3. 用 goreleaser 建置原生 binary。
#   4. 以上全部通過後才把 release tag 指向測過的 digest，所以發布的 tag 不會對應到沒驗證過的建置。
#   5. 建立 GitHub Release 草稿並附上壓縮檔；說明由維護者寫好後手動公開。
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Hub 的 image 是這個名稱加上 -hub。
  IMAGE: ghcr.io/${{ github.repository }}
  GORELEASER_VERSION: "v2.20.3"

jobs:
  # 版本由 tag 決定並寫進 binary；格式不符就中止，避免發布出版本號錯亂的產物。
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # 與 docker/metadata-action 的 SemVer 驗證一致：數字不得有前導零。
          num='(0|[1-9][0-9]*)'
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$version" =~ ^${num}\.${num}\.${num}(-${ident}(\.${ident})*)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME 不是 vX.Y.Z 或 vX.Y.Z-rc.N 格式"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  # tag 可能指向沒通過 CI 的 commit（或不在 master 上），發布前再驗證一次。
  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push by digest
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      client: ${{ steps.client.outputs.digest }}
      hub: ${{ steps.hub.outputs.digest }}
    steps:
      # image reference 不允許大寫；owner 或 repo 名稱含大寫時直接傳給 docker CLI 會失敗。
      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 這裡只推每個 tag 專屬的暫存 tag；release tag 等冒煙測試通過後再依 digest 套用。
      # 不用 sha tag：同一個 commit 先打 -rc.N 再打正式版時，兩者的 VERSION 不同，
      # 共用 sha tag 會讓後建置的覆寫前一個。
      - name: Image metadata (client)
        id: meta-client
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=staging-${{ github.ref_name }}
          # 暫存 tag 之後只會被重新標記，不能改 image 內容；版本 label 要在建置時就是
          # 真正的版本號，否則會變成 staging-<tag>。
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.value }}

      - name: Build and push (client)
        id: client
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.value }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          provenance: mode=max
          sbom: true

      - name: Image metadata (hub)
        id: meta-hub
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-hub
          flavor: latest=false
          tags: |
            type=raw,value=staging-${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=notesteme-hub
            org.opencontainers.image.version=${{ needs.version.outputs.value }}

      # 前端與 Go 的建置 stage 和 Client 共用，同一個 builder 上直接沿用。
      - name: Build and push (hub)
        id: hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: notesteme-hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-hub.outputs.tags }}
          labels: ${{ steps.meta-hub.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.value }}
          cache-from: |
            type=gha,scope=hub
            type=gha,scope=client
          cache-to: type=gha,mode=max,scope=hub
          provenance: mode=max
          sbom: true

  smoke:
    name: Smoke test digest (${{ matrix.name }})
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            suffix: ""
            script: deploy/docker/smoke-test.sh
            digest: ${{ needs.build.outputs.client }}
          - name: hub
            suffix: "-hub"
            script: deploy/docker/smoke-test-hub.sh
            digest: ${{ needs.build.outputs.hub }}
    steps:
      # image reference 不允許大寫；owner 或 repo 名稱含大寫時直接傳給 docker CLI 會失敗。
      - name: Lowercase image name
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          image="${IMAGE}${SUFFIX}"
          echo "IMAGE=${image,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 以 digest 拉取：與下一步要重新標記的是同一個 image，不是本機重建的。
      - name: Smoke test
        env:
          SCRIPT: ${{ matrix.script }}
          DIGEST: ${{ matrix.digest }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          "$SCRIPT" "${IMAGE}@${DIGEST}" "$VERSION"

  binaries:
    name: Native binaries
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # .goreleaser.yaml 的 before.hooks 會建置 Web UI（npm ci && npm run build）。
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/client/.nvmrc

      # 不讓 goreleaser 發布：GitHub Release 要等 image 也通過後，由下面的 job 建立。
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish
        env:
          # 同一個 commit 上有多個 tag（例如 -rc.N 與正式版）時，以觸發這次執行的 tag 為準。
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Verify version, embedded UI and checksums
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          for name in notesteme notesteme-hub; do
            bin="$(ls dist/${name}_linux_amd64*/${name})"
            out="$("$bin" --version)"
            echo "$out"
            if [ "$out" != "$name $VERSION" ]; then
              echo "::error::$name 的版本應該是 $VERSION，實際：$out"
              exit 1
            fi
            if ! grep -aq 'src="/assets/index-' "$bin"; then
              echo "::error::$name 沒有內嵌 Web UI 的建置產物（只有 placeholder）"
              exit 1
            fi
          done
          cd dist && sha256sum -c checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  publish:
    name: Promote tested digest (${{ matrix.name }})
    needs: [build, smoke, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            suffix: ""
            digest: ${{ needs.build.outputs.client }}
          - name: hub
            suffix: "-hub"
            digest: ${{ needs.build.outputs.hub }}
    steps:
      # image reference 不允許大寫；owner 或 repo 名稱含大寫時直接傳給 docker CLI 會失敗。
      - name: Lowercase image name
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          image="${IMAGE}${SUFFIX}"
          echo "IMAGE=${image,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 先發布這個 tag 的完整版本號（-rc.N 也一樣）；latest 與 X.Y 由下一步另外處理。
      - name: Release tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Retag the tested digest
        env:
          DIGEST: ${{ matrix.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no release tag resolved for this ref" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      # `latest` 與 X.Y 一律指向「已發布」的最高正式版（-rc.N 不動它們）。
      # 每次執行都重新計算目標，所以較舊的 tag 晚完成不會讓 alias 倒退，失敗或尚未
      # 發布的更高 tag 也不會讓 alias 停在舊版。寫入後再算一次，目標若在這段時間
      # 改變（更高版本剛好發布）就重寫：任何一次寫入之後的驗證，都看得到在它之前
      # 已發布的版本；在驗證之後才發布的版本，則由它自己的 run 在更後面寫入。
      - name: Move latest and X.Y
        id: aliases
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in
            *-*)
              echo "$GITHUB_REF_NAME 是預發布版本，不移動 latest 與 X.Y"
              echo "moved=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          series="${GITHUB_REF_NAME%.*}"

          # 重新取得 tag：checkout 之後才推送的更高版本也要看得到。只認嚴格的
          # vX.Y.Z（由新到舊，不允許前導零）；誤推的 v999、v01.2.3 不能影響版本比較。
          stable=""
          refresh_tags() {
            git fetch --quiet --force --tags origin
            stable="$(git tag --list 'v[0-9]*' \
              | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | sort -Vr || true)"
          }

          # 0 = 已發布，1 = 不存在；其他錯誤（網路、權限）直接中止，不猜。
          is_published() {
            local out
            if out="$(docker buildx imagetools inspect "${IMAGE}:${1#v}" 2>&1)"; then
              return 0
            fi
            if grep -qiE 'not found|manifest unknown|no such manifest' <<<"$out"; then
              return 1
            fi
            echo "::error::無法確認 ${1#v} 是否已發布：$out" >&2
            exit 1
          }

          # 已發布的最高版本；$1 非空時只看該 minor 系列（例如 v1.2）。
          top() {
            local v
            for v in $stable; do
              if [ -n "${1:-}" ] && [ "${v%.*}" != "$1" ]; then
                continue
              fi
              if is_published "$v"; then
                echo "$v"
                return 0
              fi
            done
          }

          converged=false
          for _ in 1 2 3; do
            refresh_tags
            latest_target="$(top)"
            minor_target="$(top "$series")"
            if [ -z "$latest_target" ] || [ -z "$minor_target" ]; then
              echo "::error::找不到已發布的正式版本（含剛發布的 $GITHUB_REF_NAME）" >&2
              exit 1
            fi
            docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${latest_target#v}"
            docker buildx imagetools create --tag "${IMAGE}:${series#v}" "${IMAGE}:${minor_target#v}"
            refresh_tags
            # 先賦值再比對：放在 [ ] 的 command substitution 裡，is_published 的 exit 1
            # 只會結束 subshell，錯誤會被吞掉。
            latest_check="$(top)"
            minor_check="$(top "$series")"
            if [ "$latest_check" = "$latest_target" ] && [ "$minor_check" = "$minor_target" ]; then
              converged=true
              break
            fi
          done
          if [ "$converged" != true ]; then
            echo "::error::latest 或 ${series#v} 的目標一直在變動，alias 可能指向舊版，請手動確認" >&2
            exit 1
          fi

          moved="latest -> ${latest_target#v}, ${series#v} -> ${minor_target#v}"
          echo "$moved"
          echo "moved=$moved" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DIGEST: ${{ matrix.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          MOVED: ${{ steps.aliases.outputs.moved }}
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "$TAGS"
            [ -z "$MOVED" ] || echo "$MOVED"
            echo '```'
            echo
            echo "Tested digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 草稿不會對外公開：維護者寫好說明後執行 gh release edit <tag> --notes-file … --draft=false（RELEASING.md）。
  github-release:
    name: Draft GitHub Release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist

      # 重新執行時只更新草稿的附件；已經公開的 Release 不覆寫。
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::$TAG 的 Release 已經公開，不覆寫附件"
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" dist/* --draft --verify-tag "${flags[@]}" \
              --title "Notesteme $VERSION" \
              --notes "草稿：公開前依 RELEASING.md 寫入發布說明。"
          fi
          echo "草稿 Release 已建立：$TAG" >> "$GITHUB_STEP_SUMMARY"

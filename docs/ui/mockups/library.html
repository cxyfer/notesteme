<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>媒體庫 | episteme mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script src="data.js"></script>
  <script src="mockup.js"></script>
  <script>
    const { renderNav, renderTopbar, renderLibrary } = window.EpistemeMockup;
    const app = document.getElementById("app");
    const main = document.createElement("main");
    main.className = "main";
    main.append(renderTopbar("媒體庫"));
    renderLibrary(main);
    app.append(renderNav("媒體庫"), main);
  </script>
</body>
</html>

# 單機部署（WSL Docker 或 VPS）。在這個目錄執行：
#   cp .env.example .env   # 填入 NOTESTEME_MASTER_KEY 與 NOTESTEME_PASSWORD
#   docker compose up -d
name: notesteme

services:
  notesteme:
    image: ${NOTESTEME_IMAGE:-ghcr.io/cxyfer/notesteme:latest}
    # docker compose build 時從原始碼建置。
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      NOTESTEME_MASTER_KEY: ${NOTESTEME_MASTER_KEY:?請在 .env 設定 NOTESTEME_MASTER_KEY}
      # 只在第一次啟動（DB 還沒有密碼）時使用，之後可以從 .env 移除。
      NOTESTEME_PASSWORD: ${NOTESTEME_PASSWORD:-}
    ports:
      # 預設只映射到 loopback；VPS 請放在提供 HTTPS 的反向代理後面（plan 第 18 節）。
      - "127.0.0.1:${NOTESTEME_PORT:-8080}:8080"
    volumes:
      - notesteme-data:/data
      # 需要設定檔時取消註解，並建立 ./config/notesteme.yaml。
      # - ./config:/config:ro

volumes:
  notesteme-data:

# Hub 的正式部署（ADR-0030 第 1、2 點）：Hub、Postgres、S3 相容儲存（SeaweedFS）。與 Client 的 compose.yaml（wsl／vps profile）分開：
# 獨立的檔案與 project name，所有服務都在 hub profile。在這個目錄執行：
#   cp .env.hub.example .env.hub   # 填入密鑰
#   mkdir -p hub-config && cp hub-config.example.yaml hub-config/notesteme-hub.yaml   # 填入 public_url、OAuth client_id
#   docker compose -f compose.hub.yaml --env-file .env.hub --profile hub up -d --build
# 啟動順序：postgres、hub-s3 healthy → hub-s3-init 建立 bucket → hub-migrate 套用 migration → hub。
# Postgres 與 hub-s3 只在 hub-internal（internal network，不對外、不映射 port）；Hub 另接 hub-egress 才能連 OAuth 供應商。
# Hub 只映射到 127.0.0.1，對外的 HTTPS 由前面的反向代理（Caddy、nginx、Cloudflare Tunnel）負責。
# 反向代理的位址要寫進設定檔的 server.trusted_proxies（例如 hub-egress 的 gateway），否則所有訪客共用代理的限流額度。
# 詳細步驟、備份與還原見 docs/hub-deployment.md。
name: notesteme-hub

services:
  hub-postgres:
    profiles: ["hub"]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: notesteme_hub
      POSTGRES_USER: notesteme_hub
      POSTGRES_PASSWORD: ${NOTESTEME_HUB_POSTGRES_PASSWORD:?請在 .env.hub 設定 NOTESTEME_HUB_POSTGRES_PASSWORD}
    volumes:
      - hub-postgres-data:/var/lib/postgresql/data
    networks:
      - hub-internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "notesteme_hub", "-d", "notesteme_hub"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3 相容的物件儲存：SeaweedFS（Apache-2.0）單一容器（master、volume、filer、S3 gateway）。
  # MinIO 社群版已停止發布 image（quay.io 要認證、Docker Hub 沒有 tag），所以改用 SeaweedFS；
  # 也可以改用 R2 或 AWS S3（移除 hub-s3 與 hub-s3-init 並改 NOTESTEME_HUB_S3_*）。
  # S3 的憑證由 NOTESTEME_HUB_S3_* 組成 identity 檔；只接受英數字（printf 不做 JSON 跳脫）。
  hub-s3:
    profiles: ["hub"]
    image: chrislusf/seaweedfs:4.55
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"hub","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip=hub-s3 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY_ID: ${NOTESTEME_HUB_S3_ACCESS_KEY_ID:?請在 .env.hub 設定 NOTESTEME_HUB_S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${NOTESTEME_HUB_S3_SECRET_ACCESS_KEY:?請在 .env.hub 設定 NOTESTEME_HUB_S3_SECRET_ACCESS_KEY}
    volumes:
      - hub-s3-data:/data
    networks:
      - hub-internal
    healthcheck:
      # 有 identity 時匿名請求回 403；有回應 HTTP 就代表 S3 gateway 起來了。
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q 'HTTP/1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 一次性：建立 bucket（已存在時不動）。用 curl 的 SigV4 簽章呼叫 S3 API，不需要額外的 CLI。
  hub-s3-init:
    profiles: ["hub"]
    image: curlimages/curl:8.18.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        empty=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        for i in $$(seq 1 30); do
          code="$$(curl -s -o /dev/null -w '%{http_code}' -X PUT --aws-sigv4 'aws:amz:us-east-1:s3' --user "$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY" -H "x-amz-content-sha256: $$empty" "http://hub-s3:9000/$$BUCKET" || true)"
          case "$$code" in 200|409) echo "bucket $$BUCKET ready ($$code)"; exit 0 ;; esac
          sleep 2
        done
        echo "建立 bucket 失敗（最後的 HTTP 狀態：$$code）" >&2
        exit 1
    environment:
      S3_ACCESS_KEY_ID: ${NOTESTEME_HUB_S3_ACCESS_KEY_ID:?請在 .env.hub 設定 NOTESTEME_HUB_S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${NOTESTEME_HUB_S3_SECRET_ACCESS_KEY:?請在 .env.hub 設定 NOTESTEME_HUB_S3_SECRET_ACCESS_KEY}
      BUCKET: ${NOTESTEME_HUB_S3_BUCKET:-notesteme-hub}
    networks:
      - hub-internal
    depends_on:
      hub-s3:
        condition: service_healthy

  # 一次性：套用資料庫 migration（多個實例同時執行時以 advisory lock 排隊）。
  hub-migrate:
    profiles: ["hub"]
    image: ${NOTESTEME_HUB_IMAGE:-notesteme-hub:local}
    # 與 hub 同一個 build（有 cache）：hub 依賴 migrate，compose 不能先拉一個還沒建置的本機 image。
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: notesteme-hub
    command: ["migrate"]
    environment:
      NOTESTEME_HUB_MASTER_KEY: ${NOTESTEME_HUB_MASTER_KEY:?請在 .env.hub 設定 NOTESTEME_HUB_MASTER_KEY}
      NOTESTEME_HUB_SESSION_KEY: ${NOTESTEME_HUB_SESSION_KEY:?請在 .env.hub 設定 NOTESTEME_HUB_SESSION_KEY}
      NOTESTEME_HUB_STORE_DSN: postgres://notesteme_hub:${NOTESTEME_HUB_POSTGRES_PASSWORD:?請在 .env.hub 設定 NOTESTEME_HUB_POSTGRES_PASSWORD}@hub-postgres:5432/notesteme_hub?sslmode=disable
      NOTESTEME_HUB_S3_ENDPOINT: http://hub-s3:9000
      NOTESTEME_HUB_S3_BUCKET: ${NOTESTEME_HUB_S3_BUCKET:-notesteme-hub}
      NOTESTEME_HUB_S3_PATH_STYLE: "true"
      NOTESTEME_HUB_S3_ACCESS_KEY_ID: ${NOTESTEME_HUB_S3_ACCESS_KEY_ID:?請在 .env.hub 設定 NOTESTEME_HUB_S3_ACCESS_KEY_ID}
      NOTESTEME_HUB_S3_SECRET_ACCESS_KEY: ${NOTESTEME_HUB_S3_SECRET_ACCESS_KEY:?請在 .env.hub 設定 NOTESTEME_HUB_S3_SECRET_ACCESS_KEY}
    volumes:
      - ./hub-config:/config:ro
    networks:
      - hub-internal
    depends_on:
      hub-postgres:
        condition: service_healthy
      hub-s3-init:
        condition: service_completed_successfully

  hub:
    profiles: ["hub"]
    image: ${NOTESTEME_HUB_IMAGE:-notesteme-hub:local}
    # docker compose build 時從原始碼建置 Hub 的 target（內嵌 web/hub）。
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: notesteme-hub
    restart: unless-stopped
    environment:
      # 兩把金鑰都至少 32 個字元（openssl rand -base64 32）；主金鑰加密下架申請的聯絡 email，遺失後無法解密，要另外保存。
      NOTESTEME_HUB_MASTER_KEY: ${NOTESTEME_HUB_MASTER_KEY:?請在 .env.hub 設定 NOTESTEME_HUB_MASTER_KEY}
      NOTESTEME_HUB_SESSION_KEY: ${NOTESTEME_HUB_SESSION_KEY:?請在 .env.hub 設定 NOTESTEME_HUB_SESSION_KEY}
      NOTESTEME_HUB_STORE_DSN: postgres://notesteme_hub:${NOTESTEME_HUB_POSTGRES_PASSWORD:?請在 .env.hub 設定 NOTESTEME_HUB_POSTGRES_PASSWORD}@hub-postgres:5432/notesteme_hub?sslmode=disable
      NOTESTEME_HUB_S3_ENDPOINT: http://hub-s3:9000
      NOTESTEME_HUB_S3_BUCKET: ${NOTESTEME_HUB_S3_BUCKET:-notesteme-hub}
      NOTESTEME_HUB_S3_PATH_STYLE: "true"
      NOTESTEME_HUB_S3_ACCESS_KEY_ID: ${NOTESTEME_HUB_S3_ACCESS_KEY_ID:?請在 .env.hub 設定 NOTESTEME_HUB_S3_ACCESS_KEY_ID}
      NOTESTEME_HUB_S3_SECRET_ACCESS_KEY: ${NOTESTEME_HUB_S3_SECRET_ACCESS_KEY:?請在 .env.hub 設定 NOTESTEME_HUB_S3_SECRET_ACCESS_KEY}
      # 有設定 client_id 的登入方式才需要（HACC-R1）。
      NOTESTEME_HUB_OAUTH_GITHUB_CLIENT_SECRET: ${NOTESTEME_HUB_OAUTH_GITHUB_CLIENT_SECRET:-}
      NOTESTEME_HUB_OAUTH_GOOGLE_CLIENT_SECRET: ${NOTESTEME_HUB_OAUTH_GOOGLE_CLIENT_SECRET:-}
      NOTESTEME_HUB_OAUTH_LINUXDO_CLIENT_SECRET: ${NOTESTEME_HUB_OAUTH_LINUXDO_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${NOTESTEME_HUB_PORT:-8090}:8090"
    volumes:
      # 設定檔（public_url、oauth.*.client_id、groups、admins…）；store.driver: postgres 與 blobs.driver: s3 要寫在這裡。
      - ./hub-config:/config:ro
      - hub-data:/data
    networks:
      - hub-internal
      - hub-egress
    depends_on:
      hub-migrate:
        condition: service_completed_successfully

networks:
  # 資料庫與物件儲存只在這個 network：internal 代表沒有對外的路由，主機上也沒有映射的 port。
  hub-internal:
    internal: true
  hub-egress: {}

volumes:
  hub-postgres-data:
  hub-s3-data:
  hub-data:
